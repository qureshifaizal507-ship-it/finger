<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Language Detection System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  font-family: 'Segoe UI', Tahoma, sans-serif;
}

body {
  min-height: 100vh;
  background: radial-gradient(circle at top, #0f172a, #020617);
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
}

/* Main Card */
.main-card {
  display: flex;
  gap: 25px;
  padding: 25px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  border-radius: 25px;
  box-shadow: 0 0 50px rgba(0,0,0,0.7);
}

/* Camera */
.camera {
  width: 640px;
  height: 480px;
  border-radius: 18px;
  overflow: hidden;
  border: 3px solid #22c55e;
  box-shadow: 0 0 25px rgba(34,197,94,0.4);
}

.camera img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Side Panel */
.panel {
  width: 320px;
  padding: 10px;
}

.panel h2 {
  text-align: center;
  font-weight: bold;
  margin-bottom: 25px;
  background: linear-gradient(to right, #22c55e, #4ade80);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* Info Cards */
.info {
  background: rgba(2,6,23,0.9);
  padding: 16px;
  border-radius: 15px;
  margin-bottom: 15px;
  border: 1px solid #334155;
  transition: 0.3s;
}

.info:hover {
  transform: scale(1.02);
  box-shadow: 0 0 15px rgba(34,197,94,0.3);
}

.label {
  font-size: 13px;
  color: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.value {
  font-size: 22px;
  margin-top: 6px;
  color: #facc15;
  font-weight: bold;
}

/* Status Badge */
.status-badge {
  display: inline-block;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: bold;
  background: #334155;
  color: #e5e7eb;
}

/* Footer */
.footer {
  text-align: center;
  font-size: 12px;
  color: #94a3b8;
  margin-top: 20px;
}

.footer span {
  color: #22c55e;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="main-card">

  <!-- Camera Section -->
  <div class="camera">
    <img src="{{ url_for('video') }}">
  </div>

  <!-- Side Panel -->
  <div class="panel">

    <h2>
      <i class="bi bi-hand-index-thumb"></i> Sign Language System
    </h2>

    <div class="info">
      <div class="label">Detected Sign</div>
      <div class="value" id="sign">NO HAND</div>
    </div>

    <div class="info">
      <div class="label">Finger Count</div>
      <div class="value" id="count">0</div>
    </div>

    <div class="info text-center">
      <div class="label">Status</div>
      <div class="status-badge" id="status">NOT DETECTED</div>
    </div>

    <div class="footer">
      Real-Time Hand Gesture Recognition<br>
      <span>Computer Vision Project</span><br>
      Press <b>CTRL + C</b> to stop server
    </div>

  </div>

</div>

<script>
async function updateData() {
  try {
    const res = await fetch("/data");
    const data = await res.json();

    document.getElementById("sign").innerText = data.sign;
    document.getElementById("count").innerText = data.count;

    const status = document.getElementById("status");
    status.innerText = data.status;

    if (data.status === "DETECTED") {
      status.style.background = "#22c55e";
      status.style.color = "#022c22";
    } else {
      status.style.background = "#334155";
      status.style.color = "#e5e7eb";
    }

  } catch (e) {
    console.log("Fetch error");
  }
}

setInterval(updateData, 200);
</script>

</body>
</html>
